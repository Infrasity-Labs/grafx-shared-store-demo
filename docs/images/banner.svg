<text x="600" y="168" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">Nothing lost. Every change can be looked up.</text>
<text x="600" y="215" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#64748b">Okto Grafx 0.0.8</text>
